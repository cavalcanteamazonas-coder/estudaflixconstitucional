<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado: Quórum e Tipos de Maioria - Wallace Cavalcante</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #2980b9;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #34495e;
            --success: #27ae60;
            --error: #e74c3c;
            --gold: #d4af37;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 4px solid var(--gold);
        }

        .nav-container {
            max-width: 800px;
            margin: 0 auto 10px;
            text-align: left;
        }

        .btn-home {
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }

        main {
            flex: 1;
            padding: 20px 15px;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
        }

        .quiz-card {
            background: var(--white);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .progress-info {
            font-size: 0.85rem;
            color: #95a5a6;
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #ecf0f1;
            padding: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1rem;
            transition: 0.2s;
            color: var(--text);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background-color: #f0f7fb;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #ebf2f7;
            font-weight: bold;
        }

        .feedback {
            margin-top: 20px;
            padding: 18px;
            border-radius: 8px;
            display: none;
            font-size: 0.95rem;
        }

        .correct { background-color: #d4edda; color: #155724; border-left: 5px solid var(--success); }
        .wrong { background-color: #f8d7da; color: #721c24; border-left: 5px solid var(--error); }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            margin-top: 20px;
        }

        #result-screen { display: none; text-align: center; }
        .final-score { font-size: 3.5rem; color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

<header>
    <div class="nav-container"><a href="index.html" class="btn-home">← PÁGINA INICIAL</a></div>
    <h1>Quórum e Tipos de Maioria</h1>
    <p>Processo Legislativo e Regras de Deliberação</p>
</header>

<main>
    <div id="quiz-area" class="quiz-card">
        <div id="progress" class="progress-info">Questão 1 de 7</div>
        <div id="question-content"></div>
        <div id="feedback-box" class="feedback"></div>
        <button id="action-btn" class="btn-action" onclick="handleAction()">Confirmar Resposta</button>
    </div>

    <div id="result-screen" class="quiz-card">
        <h2>Simulado Concluído!</h2>
        <div class="final-score" id="final-score">0/0</div>
        <p id="performance-text"></p>
        <button class="btn-action" style="float:none; margin-top:30px;" onclick="location.reload()">Refazer Simulado</button>
    </div>
</main>

<script>
    const questions = [
        {
            p: "Em uma sessão com 300 parlamentares presentes, um projeto de lei ordinária recebeu 151 votos favoráveis e 149 contrários. Qual a situação do projeto?",
            opts: ["A) Rejeitado, pois não alcançou a maioria absoluta (257 votos).", "B) Aprovado por maioria simples dos presentes.", "C) Rejeitado, pois exigia maioria qualificada de três quintos.", "D) Pendente de nova votação por empate técnico."],
            cor: "B",
            com: "Art. 47 da CF/88. Para leis ordinárias, basta a maioria dos presentes (simples), desde que a maioria absoluta da Casa esteja presente."
        },
        {
            p: "Qual o requisito de votação para a aprovação de uma Lei Complementar?",
            opts: ["A) Maioria simples dos presentes.", "B) Maioria absoluta dos membros da Casa Legislativa.", "C) Três quintos dos membros em dois turnos.", "D) Unanimidade dos líderes partidários."],
            cor: "B",
            com: "Art. 69 da CF/88. A lei complementar exige um consenso maior: mais da metade de todos os membros da Casa (ex: 41 no Senado)."
        },
        {
            p: "Como se define tecnicamente a 'Maioria Absoluta'?",
            opts: ["A) Metade mais um dos parlamentares que compareceram no dia.", "B) A maioria dos votos válidos, excluídas as abstenções.", "C) O primeiro número inteiro superior à metade do total de membros da Casa.", "D) O dobro da representação da minoria parlamentar."],
            cor: "C",
            com: "A maioria absoluta é um número fixo. Na Câmara (513 membros), a maioria absoluta é sempre 257."
        },
        {
            p: "Para aprovar uma Proposta de Emenda à Constituição (PEC), o quórum exigido é de:",
            opts: ["A) Maioria absoluta em turno único.", "B) Três quintos dos membros de cada Casa, em dois turnos.", "C) Dois terços dos presentes em sessão conjunta.", "D) Maioria simples após três debates em plenário."],
            cor: "B",
            com: "Art. 60, §2º da CF/88. É o quórum mais rigoroso do processo legislativo comum."
        },
        {
            p: "No Senado Federal (81 membros), quantos senadores precisam estar presentes para que uma votação possa ser iniciada validamente?",
            opts: ["A) Qualquer número, desde que o Presidente esteja presente.", "B) Pelo menos 41 senadores (maioria absoluta).", "C) Pelo menos 54 senadores (dois terços).", "D) No mínimo 21 senadores."],
            cor: "B",
            com: "Art. 47 da CF/88. O quórum de instalação/deliberação para a maioria das matérias é a presença da maioria absoluta."
        },
        {
            p: "A maioria qualificada é uma exceção à regra geral. Um exemplo de sua aplicação é:",
            opts: ["A) Aprovação de leis ordinárias urgentes.", "B) Votação de requerimentos de informação.", "C) Aprovação de emendas constitucionais (3/5).", "D) Nomeação de assessores parlamentares."],
            cor: "C",
            com: "Maiorias qualificadas (frações como 3/5 ou 2/3) são exigidas em casos de alta relevância política e jurídica."
        },
        {
            p: "Em uma votação com 260 deputados presentes, houve 130 votos 'sim', 120 'não' e 10 abstenções. O projeto de lei ordinária foi:",
            opts: ["A) Rejeitado por falta de maioria absoluta.", "B) Aprovado, pois os favoráveis superaram os contrários entre os votantes.", "C) Rejeitado por empate entre favoráveis e ausentes.", "D) Encaminhado ao Senado para desempate."],
            cor: "B",
            com: "Na maioria simples, ganha quem tem mais votos 'sim' do que 'não' entre os presentes, respeitado o quórum de instalação."
        }
    ];

    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    let selected = null;

    function showQuestion() {
        const q = questions[currentIndex];
        isAnswered = false;
        selected = null;
        document.getElementById('progress').innerText = `Questão ${currentIndex + 1} de ${questions.length}`;
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('action-btn').innerText = "Confirmar Resposta";
        
        let html = `<div class="question-text">${q.p}</div><div class="options-container">`;
        q.opts.forEach(opt => {
            html += `<button class="option-btn" onclick="selectOpt('${opt.charAt(0)}', this)">${opt}</button>`;
        });
        html += `</div>`;
        document.getElementById('question-content').innerHTML = html;
    }

    function selectOpt(letter, btn) {
        if(isAnswered) return;
        selected = letter;
        document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function handleAction() {
        if(!selected) return alert("Por favor, selecione uma alternativa.");
        if(!isAnswered) {
            isAnswered = true;
            const q = questions[currentIndex];
            const fb = document.getElementById('feedback-box');
            fb.style.display = 'block';
            if(selected === q.cor) {
                score++;
                fb.className = "feedback correct";
                fb.innerHTML = "<strong>Resposta Correta!</strong><br>" + q.com;
            } else {
                fb.className = "feedback wrong";
                fb.innerHTML = "<strong>Resposta Incorreta.</strong> O gabarito é a letra " + q.cor + ".<br>" + q.com;
            }
            document.getElementById('action-btn').innerText = currentIndex === questions.length - 1 ? "Ver Resultado Final" : "Próxima Questão";
        } else {
            currentIndex++;
            if(currentIndex < questions.length) showQuestion();
            else showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        const p = (score/questions.length)*100;
        document.getElementById('performance-text').innerText = p >= 70 ? "Excelente desempenho! Você domina os quóruns constitucionais." : "Bom esforço! Revise os cálculos de maioria absoluta e simples.";
    }

    window.onload = showQuestion;
</script>
</body>
</html>
